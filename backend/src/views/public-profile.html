<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Public Learning Profile</title>
  <link rel="stylesheet" href="/public-assets/public-profile.css" />
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>__USERNAME__</h1>
      <p class="muted">Public profile shared from AI Learning Assistant</p>
      <p><strong>Account Tier:</strong> __ACCOUNT_TIER__</p>
      <p><strong>Interests:</strong> __INTERESTS__</p>
    </div>

    <div class="card">
      <h2>Learning History</h2>
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Score</th>
            <th>Topics</th>
            <th>Task Prompt</th>
          </tr>
        </thead>
        <tbody>
          __HISTORY_ROWS__
        </tbody>
      </table>
    </div>
  </div>
</body>
</html>
